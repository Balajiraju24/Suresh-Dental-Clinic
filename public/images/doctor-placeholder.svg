<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="50%" stop-color="#143e68" />
      <stop offset="100%" stop-color="#0b5c75" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle background grid/rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Doctor Silhouette -->
  <g filter="url(#shadow)">
    <!-- Head outline -->
    <ellipse cx="200" cy="155" rx="55" ry="65" fill="#cbd5e1" opacity="0.9" />
    <!-- Neck -->
    <path d="M185 205 L215 205 L222 250 L178 250 Z" fill="#94a3b8" />
    
    <!-- White Clinical Coat & Shoulders -->
    <path d="M110 370 C110 270 145 250 178 245 L200 295 L222 245 C255 250 290 270 290 370 Z" fill="url(#coatGrad)" />
    
    <!-- Inner Shirt & Tie / Collar -->
    <polygon points="180,245 200,285 220,245" fill="#0284c7" />
    <polygon points="194,275 200,340 206,275" fill="#0f172a" />
    
    <!-- Coat Lapels -->
    <path d="M178 245 L155 330 L190 370 L198 290 Z" fill="#f8fafc" />
    <path d="M222 245 L245 330 L210 370 L202 290 Z" fill="#f1f5f9" />
    
    <!-- Stethoscope -->
    <path d="M165 245 C150 280 155 340 185 345 C192 346 195 340 195 335" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" />
    <path d="M235 245 C250 280 245 340 215 345" fill="none" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="208" cy="350" r="10" fill="#0f766e" stroke="#fff" stroke-width="2" />
  </g>

  <!-- Professional Verification Card Overlay at bottom -->
  <g transform="translate(30, 385)">
    <rect width="340" height="68" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Shield / Badge Icon -->
    <g transform="translate(16, 18)">
      <circle cx="16" cy="16" r="16" fill="url(#accentGrad)" />
      <path d="M16 8 L22 11 V17 C22 21 16 24 16 24 C16 24 10 21 10 17 V11 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13 16 L15 18 L19 14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Text -->
    <text x="60" y="27" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      DOCTOR PROFILE PREVIEW
    </text>
    <text x="60" y="47" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">
      Official clinic portrait pending verification
    </text>
  </g>
</svg>
